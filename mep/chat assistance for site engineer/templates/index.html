<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SiteAI — Engineer Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-w:260px;
  --sidebar-bg:#171717;
  --bg:#212121;
  --surface:#2a2a2a;
  --input-bg:#2f2f2f;
  --border:#3a3a3a;
  --border-light:#484848;
  --text:#ececec;
  --text-dim:#8e8e8e;
  --text-faint:#4a4a4a;
  --amber:#f59e0b;
  --amber-bg:rgba(245,158,11,0.10);
  --amber-border:rgba(245,158,11,0.22);
  --green:#4ade80;
  --red:#f87171;
  --blue:#60a5fa;
  --user-bg:#2f2f2f;
  --sans:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;font-size:15px;line-height:1.6}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#404040;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#606060}

/* ── SIDEBAR ───────────────────────── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  z-index:50;overflow:hidden;
  transition:transform .25s ease;
}
.sidebar-top{padding:12px 10px 6px;display:flex;gap:6px;align-items:center}
.btn-new{
  flex:1;display:flex;align-items:center;gap:9px;
  background:transparent;border:none;color:var(--text);
  font-family:var(--sans);font-size:.85rem;font-weight:500;
  cursor:pointer;padding:8px 11px;border-radius:8px;
  transition:background .15s;text-align:left;
}
.btn-new:hover{background:rgba(255,255,255,.07)}
.btn-new svg{width:17px;height:17px;opacity:.65;flex-shrink:0}
.btn-icon{
  background:transparent;border:none;color:var(--text-dim);
  cursor:pointer;padding:7px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.btn-icon:hover{background:rgba(255,255,255,.07)}
.btn-icon svg{width:19px;height:19px}
.sidebar-label{
  font-size:.64rem;font-family:var(--mono);color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.09em;
  padding:10px 15px 5px;
}
.session-list{flex:1;overflow-y:auto;padding:0 7px 8px;display:flex;flex-direction:column;gap:1px}
.s-item{
  padding:8px 11px;border-radius:7px;cursor:pointer;
  font-size:.82rem;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:7px;
  transition:background .15s,color .15s;
}
.s-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.s-item.active{background:rgba(255,255,255,.09);color:var(--text)}
.s-item svg{width:13px;height:13px;flex-shrink:0;opacity:.45}
.sidebar-footer{padding:10px;border-top:1px solid var(--border)}
.model-tag{
  display:flex;align-items:center;gap:8px;
  font-size:.72rem;font-family:var(--mono);color:var(--text-faint);
  padding:8px 11px;border-radius:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
}
.model-dot{width:7px;height:7px;background:var(--amber);border-radius:50%;flex-shrink:0;box-shadow:0 0 7px var(--amber)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}

/* ── MAIN ──────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}

/* Top bar */
.topbar{
  height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--bg);z-index:10;
}
.topbar-left{display:flex;align-items:center;gap:9px}
.btn-menu{display:none;background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:6px;border-radius:6px;transition:background .15s}
.btn-menu:hover{background:rgba(255,255,255,.07)}
.btn-menu svg{width:20px;height:20px}
.logo-txt{font-size:.92rem;font-weight:600;display:flex;align-items:center;gap:6px}
.logo-txt .ac{color:var(--amber)}
.topbar-badge{font-size:.61rem;font-family:var(--mono);background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:4px;border:1px solid var(--amber-border)}
.topbar-right{font-size:.7rem;font-family:var(--mono);color:var(--text-faint)}

/* Chat area */
.chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.chat-inner{width:100%;max-width:760px;padding:22px 22px 0;display:flex;flex-direction:column;gap:0}

/* ── WELCOME ───────────────────────── */
.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  padding:4rem 2rem;animation:fadeUp .4s ease;
}
.w-icon{
  width:58px;height:58px;background:linear-gradient(135deg,#f59e0b,#d97706);
  border-radius:15px;display:grid;place-items:center;font-size:26px;
  margin-bottom:18px;box-shadow:0 8px 30px rgba(245,158,11,.28);
}
.welcome h1{font-size:1.65rem;font-weight:600;margin-bottom:8px}
.welcome p{font-size:.88rem;color:var(--text-dim);max-width:400px;line-height:1.7;margin-bottom:28px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:540px}
.sug{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.sug:hover{border-color:var(--amber);background:var(--amber-bg)}
.sug-t{font-size:.8rem;font-weight:500;color:var(--text);margin-bottom:2px}
.sug-s{font-size:.73rem;color:var(--text-dim)}

/* ── MESSAGES ──────────────────────── */
.msg-group{
  display:flex;flex-direction:column;
  padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
  animation:fadeUp .22s ease;
}
.msg-group:last-child{border-bottom:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* User */
.msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:7px;margin-bottom:6px}
.user-atts{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.u-img-thumb{width:200px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.u-file-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 11px;max-width:250px;
}
.fc-icon{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.fc-icon.pdf{background:#3d1515}
.fc-icon.docx{background:#0f1e35}
.fc-icon.txt{background:#1a2710}
.fc-icon.csv{background:#0d2218}
.fc-icon.img{background:#1f1808}
.fc-icon.other{background:#1c1c1c}
.fc-info{min-width:0}
.fc-name{font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.fc-sz{font-size:.65rem;color:var(--text-dim);font-family:var(--mono)}
.user-bubble{
  background:var(--user-bg);border:1px solid var(--border-light);
  border-radius:16px 16px 4px 16px;
  padding:11px 15px;max-width:82%;
  font-size:.92rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}

/* AI */
.msg-ai{display:flex;gap:13px;align-items:flex-start}
.ai-av{
  width:31px;height:31px;border-radius:8px;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  display:grid;place-items:center;font-size:15px;
  flex-shrink:0;margin-top:2px;
}

/* AI response card */
.ai-resp{font-size:.91rem;line-height:1.68;flex:1;min-width:0}
.r-solution{
  background:var(--amber-bg);border:1px solid var(--amber-border);
  border-radius:10px;padding:13px 15px;margin-bottom:13px;
}
.r-sol-lbl{
  font-size:.65rem;font-family:var(--mono);color:var(--amber);
  text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:5px;display:flex;align-items:center;gap:4px;
}
.r-sol-txt{font-size:.93rem;font-weight:500;color:var(--text);line-height:1.6}
.r-blk{margin-bottom:11px}
.r-blk-lbl{
  font-size:.68rem;font-family:var(--mono);color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:3px;display:flex;align-items:center;gap:4px;
}
.r-blk-txt{color:var(--text);line-height:1.65}
.r-safety{
  background:rgba(248,113,113,.07);
  border-left:3px solid var(--red);
  border-radius:0 8px 8px 0;
  padding:9px 13px;margin-bottom:11px;
}
.r-safety .r-blk-lbl{color:var(--red)}
.r-footer{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;
  padding-top:10px;border-top:1px solid var(--border);
}
.r-ref{font-size:.72rem;font-family:var(--mono);color:var(--text-faint);display:flex;align-items:center;gap:4px}
.conf-wrap{display:flex;align-items:center;gap:7px;font-size:.71rem;font-family:var(--mono);color:var(--text-dim)}
.conf-track{width:76px;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.conf-fill{height:100%;border-radius:99px;transition:width 1s ease}
.conf-h{background:var(--green)}.conf-m{background:var(--amber)}.conf-l{background:var(--red)}

/* Plain text / insufficient */
.ai-plain{font-size:.91rem;line-height:1.68;color:var(--text);white-space:pre-wrap;word-break:break-word;flex:1}

/* Typing */
.typing{display:flex;align-items:center;gap:4px;padding:4px 0;height:26px}
.typing span{
  width:6px;height:6px;background:var(--text-dim);border-radius:50%;
  animation:tbounce 1.2s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes tbounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}

/* Error */
.err-card{
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);
  border-radius:10px;padding:11px 14px;
  color:#fca5a5;font-size:.84rem;
  display:flex;align-items:flex-start;gap:9px;flex:1;
}
.err-card svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}

/* ── INPUT AREA ────────────────────── */
.input-wrap{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:10px 20px 18px;
  background:linear-gradient(to top,var(--bg) 82%,transparent);
  flex-shrink:0;
}
.input-box{
  width:100%;max-width:760px;
  background:var(--input-bg);
  border:1px solid var(--border-light);
  border-radius:15px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
}
.input-box:focus-within{border-color:#565656;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.input-box.drag-over{border-color:var(--amber)!important}

/* Attachment chips inside input box */
.att-prev{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 0}
.att-prev:empty{display:none}
.att-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border-light);
  border-radius:8px;padding:4px 7px 4px 5px;max-width:195px;
}
.ac-img{width:34px;height:34px;object-fit:cover;border-radius:5px;flex-shrink:0}
.ac-ico{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--bg)}
.ac-info{min-width:0;flex:1}
.ac-name{font-size:.73rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:105px}
.ac-type{font-size:.61rem;color:var(--text-dim);font-family:var(--mono)}
.ac-rm{
  width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.1);
  border:none;color:var(--text-dim);cursor:pointer;font-size:10px;
  display:grid;place-items:center;flex-shrink:0;transition:background .15s;line-height:1;
}
.ac-rm:hover{background:rgba(248,113,113,.35);color:var(--red)}

/* Textarea row */
.ta-row{display:flex;align-items:flex-end;gap:0;padding:9px 11px 9px 13px}
#msgInput{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--sans);font-size:.91rem;
  resize:none;max-height:200px;min-height:24px;
  line-height:1.6;padding:0;overflow-y:auto;
}
#msgInput::placeholder{color:var(--text-faint)}
.ta-btns{display:flex;align-items:center;gap:3px;margin-left:7px}
.btn-att{
  width:35px;height:35px;border-radius:8px;background:transparent;border:none;
  color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;flex-shrink:0;
}
.btn-att:hover{background:rgba(255,255,255,.08);color:var(--text)}
.btn-att svg{width:19px;height:19px}
.btn-send{
  width:35px;height:35px;border-radius:8px;background:var(--amber);border:none;
  color:#000;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,opacity .15s;flex-shrink:0;
}
.btn-send:hover{background:#fbbf24}
.btn-send:disabled{opacity:.28;cursor:not-allowed}
.btn-send svg{width:17px;height:17px}
#fileInput{display:none}
.input-hint{font-size:.65rem;color:var(--text-faint);font-family:var(--mono);margin-top:7px;text-align:center}

/* ── RESPONSIVE ────────────────────── */
@media(max-width:680px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .btn-menu{display:flex}
  .topbar{padding:0 12px}
  .chat-inner{padding:16px 13px 0}
  .input-wrap{padding:8px 11px 14px}
  .suggestions{grid-template-columns:1fr}
  .welcome h1{font-size:1.35rem}
  .welcome p{font-size:.83rem}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <button class="btn-new" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>
    <button class="btn-icon" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    </button>
  </div>
  <div class="sidebar-label">Recent</div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-footer">
    <div class="model-tag">
      <div class="model-dot"></div>
      SiteAI · GPT-4o-mini
    </div>
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="logo-txt">🏗 Site<span class="ac">AI</span></div>
      <div class="topbar-badge">Engineer Assistant</div>
    </div>
    <div class="topbar-right">localhost:5000</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
      <!-- Welcome injected by JS -->
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-box" id="inputBox">
      <div class="att-prev" id="attPrev"></div>
      <div class="ta-row">
        <textarea id="msgInput" rows="1"
          placeholder="Ask about anchors, loads, materials, installation…"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <div class="ta-btns">
          <button class="btn-att" title="Attach image / PDF / document" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button class="btn-send" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line &nbsp;·&nbsp; Drop files anywhere</div>
  </div>

  <input type="file" id="fileInput" multiple
    accept="image/*,.pdf,.doc,.docx,.txt,.csv,.json,.xls,.xlsx"
    onchange="handleFileSelect(this.files)"/>
</div>

<script>
/* ─── STATE ─────────────────────────── */
const API = 'http://localhost:5000';
let pending   = [];          // attachments queued before send
let sessions  = [];          // [{id,title,messages:[]}]
let curId     = null;
let busy      = false;

/* ─── WELCOME HTML ──────────────────── */
const WELCOME_HTML = `
<div class="welcome" id="welcomeScreen">
  <div class="w-icon">🏗</div>
  <h1>Site Engineer Assistant</h1>
  <p>Ask anything about anchor selection, load checks, material guidance, installation procedures, or on-site safety. Attach images, drawings, PDFs, or documents for full context.</p>
  <div class="suggestions">
    <div class="sug" onclick="useSug(this)">
      <div class="sug-t">⚙ Anchor Recommendation</div>
      <div class="sug-s">What anchor for 15kN tensile load on C25 concrete?</div>
    </div>
    <div class="sug" onclick="useSug(this)">
      <div class="sug-t">🔍 Load Check</div>
      <div class="sug-s">Check shear and tensile capacity for M16 bolt</div>
    </div>
    <div class="sug" onclick="useSug(this)">
      <div class="sug-t">🔧 Installation Guide</div>
      <div class="sug-s">Steps to install chemical anchor in hollow block</div>
    </div>
    <div class="sug" onclick="useSug(this)">
      <div class="sug-t">⚠ Safety Check</div>
      <div class="sug-s">Edge distance requirements for seismic zone anchor</div>
    </div>
  </div>
</div>`;

/* ─── SESSION MANAGEMENT ────────────── */
function newChat(){
  const id='s_'+Date.now();
  sessions.unshift({id,title:'New Chat',messages:[]});
  curId=id;
  document.getElementById('chatInner').innerHTML=WELCOME_HTML;
  renderSessions();
  closeMobile();
  document.getElementById('msgInput').focus();
}

function loadSession(id){
  curId=id;
  const s=sessions.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('chatInner').innerHTML='';
  s.messages.forEach(m=>{
    if(m.role==='user') renderUserMsg(m.text,m.atts||[]);
    else renderAIMsg(m.data);
  });
  renderSessions();
  closeMobile();
  scrollBottom();
}

function renderSessions(){
  document.getElementById('sessionList').innerHTML=
    sessions.map(s=>`
      <div class="s-item${s.id===curId?' active':''}" onclick="loadSession('${s.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        ${esc(s.title)}
      </div>`
    ).join('');
}

function getSess(){
  if(!curId) newChat();
  return sessions.find(s=>s.id===curId);
}

/* ─── SEND ──────────────────────────── */
async function sendMessage(){
  if(busy) return;
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text && pending.length===0) return;

  const atts=[...pending];
  pending=[];
  renderChips();
  inp.value='';
  autoResize(inp);

  // hide welcome
  const ws=document.getElementById('welcomeScreen');
  if(ws) ws.remove();

  renderUserMsg(text,atts);

  const sess=getSess();
  sess.messages.push({role:'user',text,atts:atts.map(a=>({
    name:a.name,fileType:a.fileType,size:a.size,
    preview:a.isImage?a.preview:null
  }))});
  if(sess.title==='New Chat'&&text){
    sess.title=text.substring(0,38)+(text.length>38?'…':'');
    renderSessions();
  }

  await callAPI(text,atts);
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
}

/* ─── API CALL ──────────────────────── */
async function callAPI(text,atts){
  busy=true;
  document.getElementById('sendBtn').disabled=true;

  // Build query string with file content
  let q=[text];
  atts.forEach(a=>{
    if(a.isImage)            q.push(`\n[Attached image: ${a.name}]`);
    else if(a.textContent)   q.push(`\n[Attached document: ${a.name}]\n---\n${a.textContent.substring(0,3500)}\n---`);
    else                     q.push(`\n[Attached file: ${a.name}]`);
  });

  const payload={
    query:               q.join('\n'),
    material_context:    getMaterial(text)||'As described in the query',
    application_type:    getAppType(text)||'site_assistance',
    environment:         getEnv(text)||'on_site'
  };

  const typingEl=showTyping();
  try{
    const res=await fetch(`${API}/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await res.json();
    typingEl.remove();

    if(!res.ok||!data.success){
      const miss=data.missing_fields?` (missing: ${data.missing_fields.join(', ')})`:'';
      renderErr((data.error||`HTTP ${res.status}`)+miss);
    } else {
      renderAIMsg(data.response);
      getSess().messages.push({role:'assistant',data:data.response});
    }
  }catch(e){
    typingEl.remove();
    renderErr(`Cannot reach server at ${API}/chat — make sure Flask is running. (${e.message})`);
  }

  busy=false;
  document.getElementById('sendBtn').disabled=false;
  scrollBottom();
}

/* ─── CONTEXT EXTRACTION ────────────── */
function getMaterial(t){
  const mats=['concrete','c20','c25','c30','c35','c40','steel','masonry','brick','hollow block','timber','precast','rebar','mortar','epoxy'];
  const f=mats.filter(m=>t.toLowerCase().includes(m));
  return f.length?f.join(', '):null;
}
function getAppType(t){
  const tl=t.toLowerCase();
  if(/anchor|bolt|fasten|fix/.test(tl))      return 'anchor_installation';
  if(/load|tension|shear|compressive/.test(tl))return 'load_check';
  if(/install|procedure|step/.test(tl))       return 'installation_guidance';
  if(/safe|hazard|risk|warning/.test(tl))     return 'safety_inspection';
  if(/material|select|choose|recommend/.test(tl))return 'material_selection';
  if(/rebar|reinforce/.test(tl))              return 'rebar_connection';
  return null;
}
function getEnv(t){
  const tl=t.toLowerCase();
  if(/seismic|earthquake/.test(tl))           return 'seismic_zone';
  if(/outdoor|external|exposed/.test(tl))     return 'outdoor_exposed';
  if(/coastal|marine|salt/.test(tl))          return 'coastal';
  if(/chemical|acid|corros/.test(tl))         return 'chemical_exposure';
  if(/wet|humid|damp/.test(tl))               return 'indoor_wet';
  if(/underground|submerg/.test(tl))          return 'underground';
  if(/high.?temp|furnace/.test(tl))           return 'high_temperature';
  return null;
}

/* ─── RENDER USER MESSAGE ───────────── */
function renderUserMsg(text,atts){
  const ci=document.getElementById('chatInner');
  const g=document.createElement('div');
  g.className='msg-group';

  let attHtml='';
  if(atts.length){
    attHtml='<div class="msg-user"><div class="user-atts">';
    atts.forEach(a=>{
      if(a.isImage&&a.preview){
        attHtml+=`<img class="u-img-thumb" src="${a.preview}" alt="${esc(a.name)}"/>`;
      } else {
        attHtml+=`
          <div class="u-file-chip">
            <div class="fc-icon ${a.fileType}">${fEmoji(a.fileType)}</div>
            <div class="fc-info">
              <div class="fc-name" title="${esc(a.name)}">${esc(a.name)}</div>
              <div class="fc-sz">${a.fileType.toUpperCase()} · ${fmtSize(a.size)}</div>
            </div>
          </div>`;
      }
    });
    attHtml+='</div></div>';
  }
  const txtHtml=text?`<div class="msg-user"><div class="user-bubble">${esc(text)}</div></div>`:'';
  g.innerHTML=attHtml+txtHtml;
  ci.appendChild(g);
  scrollBottom();
}

/* ─── RENDER AI MESSAGE ─────────────── */
function renderAIMsg(response){

  const ci = document.getElementById('chatInner');

  const g = document.createElement('div');

  g.className = 'msg-group';

  let html = '';

  // NORMAL TEXT RESPONSE
  if(typeof response === 'string'){

    html = `
      <div class="msg-ai">
        <div class="ai-av">🏗</div>

        <div class="ai-plain">
          ${formatMarkdown(response)}
        </div>
      </div>
    `;
  }

  // JSON RESPONSE
  else{

    html = `
      <div class="msg-ai">
        <div class="ai-av">🏗</div>

        <div class="ai-plain">
          <pre>${JSON.stringify(response, null, 2)}</pre>
        </div>
      </div>
    `;
  }

  g.innerHTML = html;

  ci.appendChild(g);

  scrollBottom();
}
/* ─── RENDER ERROR ──────────────────── */
function renderErr(msg){
  const ci=document.getElementById('chatInner');
  const g=document.createElement('div');
  g.className='msg-group';
  g.innerHTML=`
    <div class="msg-ai">
      <div class="ai-av" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">⛔</div>
      <div class="err-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        ${esc(msg)}
      </div>
    </div>`;
  ci.appendChild(g);
}

/* ─── TYPING INDICATOR ──────────────── */
function showTyping(){
  const ci=document.getElementById('chatInner');
  const el=document.createElement('div');
  el.className='msg-group';
  el.id='typing';
  el.innerHTML=`
    <div class="msg-ai">
      <div class="ai-av">🏗</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  ci.appendChild(el);
  scrollBottom();
  return el;
}

/* ─── FILE HANDLING ─────────────────── */
function handleFileSelect(files){
  Array.from(files).forEach(file=>{
    const att={
      id:'a_'+Date.now()+'_'+Math.random().toString(36).slice(2),
      name:file.name,size:file.size,mimeType:file.type,
      fileType:getType(file),
      isImage:file.type.startsWith('image/'),
      preview:null,textContent:null
    };
    const r=new FileReader();
    if(att.isImage){
      r.onload=e=>{att.preview=e.target.result;pending.push(att);renderChips()};
      r.readAsDataURL(file);
    } else if(['txt','csv','json','xml'].includes(att.fileType)){
      r.onload=e=>{att.textContent=e.target.result;pending.push(att);renderChips()};
      r.readAsText(file);
    } else if(att.fileType==='pdf'){
      r.onload=e=>{
        const raw=e.target.result||'';
        att.textContent=raw.length<60000?raw:`[PDF: ${file.name} – content noted, browser extraction limited]`;
        pending.push(att);renderChips();
      };
      r.readAsText(file);
    } else {
      pending.push(att);renderChips();
    }
  });
  document.getElementById('fileInput').value='';
}

function getType(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(file.type.startsWith('image/')) return 'img';
  if(ext==='pdf')                     return 'pdf';
  if(ext==='doc'||ext==='docx')       return 'docx';
  if(ext==='txt')                     return 'txt';
  if(ext==='csv'||ext==='xls'||ext==='xlsx') return 'csv';
  if(ext==='json')                    return 'txt';
  return 'other';
}

function fEmoji(t){return{pdf:'📄',docx:'📝',txt:'📃',csv:'📊',img:'🖼',other:'📎'}[t]||'📎'}

function removeAtt(id){pending=pending.filter(a=>a.id!==id);renderChips()}

function renderChips(){
  document.getElementById('attPrev').innerHTML=pending.map(a=>
    a.isImage&&a.preview
    ?`<div class="att-chip">
        <img class="ac-img" src="${a.preview}" alt="${esc(a.name)}"/>
        <div class="ac-info">
          <div class="ac-name" title="${esc(a.name)}">${esc(a.name)}</div>
          <div class="ac-type">Image · ${fmtSize(a.size)}</div>
        </div>
        <button class="ac-rm" onclick="removeAtt('${a.id}')">✕</button>
      </div>`
    :`<div class="att-chip">
        <div class="ac-ico">${fEmoji(a.fileType)}</div>
        <div class="ac-info">
          <div class="ac-name" title="${esc(a.name)}">${esc(a.name)}</div>
          <div class="ac-type">${a.fileType.toUpperCase()} · ${fmtSize(a.size)}</div>
        </div>
        <button class="ac-rm" onclick="removeAtt('${a.id}')">✕</button>
      </div>`
  ).join('');
}

/* ─── DRAG & DROP ───────────────────── */
const ib=document.getElementById('inputBox');
ib.addEventListener('dragover',e=>{e.preventDefault();ib.classList.add('drag-over')});
ib.addEventListener('dragleave',()=>ib.classList.remove('drag-over'));
ib.addEventListener('drop',e=>{
  e.preventDefault();ib.classList.remove('drag-over');
  if(e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files);
});
// also allow drop on whole page
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  if(e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files);
});

/* ─── WELCOME SUGGESTIONS ───────────── */
function useSug(el){
  const t=el.querySelector('.sug-s').textContent;
  document.getElementById('msgInput').value=t;
  autoResize(document.getElementById('msgInput'));
  document.getElementById('msgInput').focus();
}
function formatMarkdown(text){

  return marked.parse(text);

}
/* ─── UTILS ─────────────────────────── */
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,200)+'px';
}
function scrollBottom(){
  const ca=document.getElementById('chatArea');
  requestAnimationFrame(()=>{ca.scrollTop=ca.scrollHeight});
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeMobile(){
  if(window.innerWidth<=680){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
}
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}
