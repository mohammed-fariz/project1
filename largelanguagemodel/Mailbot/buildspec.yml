version: 0.2

phases:

pre_build:
commands:
- echo Logging in to Amazon ECR
- aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REPOSITORY_URI

build:
commands:
- echo Moving to Mailbot folder
- cd largelanguagemodel/Mailbot
- echo Building Docker image
- docker build -t mailbot .
- docker tag mailbot:latest $REPOSITORY_URI:latest

post_build:
commands:
- echo Pushing image to ECR
- docker push $REPOSITORY_URI:latest
