name: CI Pipeline

on:
  push:
    branches:
      - feature-ci-new
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      BACKEND_REPO: 428056470896.dkr.ecr.us-east-1.amazonaws.com/backend
      MCP_REPO: 428056470896.dkr.ecr.us-east-1.amazonaws.com/mcp_server

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: docker build -t backend ./agentic_mail_bot/backend

      - name: Build MCP server image
        run: docker build -t mcp_server ./agentic_mail_bot/mcp_server

      - name: Tag backend image
        run: docker tag backend:latest $BACKEND_REPO:latest

      - name: Tag MCP server image
        run: docker tag mcp_server:latest $MCP_REPO:latest

      - name: Push backend image
        run: docker push $BACKEND_REPO:latest

      - name: Push MCP server image
        run: docker push $MCP_REPO:latest