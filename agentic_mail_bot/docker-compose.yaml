version: "3.8"

services:

  db:
    image: postgres:17
    container_name: chatbot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2004
      POSTGRES_DB: agentic_mail_bot
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: agentic-backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - mcp
    ports:
      - "8000:8000"

  mcp:
    build: ./mcp_server
    container_name: mcp
    env_file:
      - ./mcp_server/.env
    ports:
      - "3333:3333"